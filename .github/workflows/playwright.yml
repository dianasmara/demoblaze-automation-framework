name: 🎭 Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly regression run at 02:00 WIB (UTC+7)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options: [all, ui, api, regression, performance]
      browser:
        description: 'Browser(s)'
        required: false
        default: 'chromium'
        type: choice
        options: [chromium, firefox, webkit, all]

# ─── Concurrency: cancel in-flight runs on same branch ──────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL:         https://www.demoblaze.com
  VALID_USERNAME:   ${{ secrets.VALID_USERNAME }}
  VALID_PASSWORD:   ${{ secrets.VALID_PASSWORD }}
  HEADLESS:         true
  NODE_VERSION:     '20'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Install & Cache Dependencies
  # ──────────────────────────────────────────────────────────────────────────
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Type Check & Lint
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Type Check & Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run type-check

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Regression Tests (fastest, run on every PR)
  # ──────────────────────────────────────────────────────────────────────────
  regression:
    name: 🔁 Regression — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: [install, lint]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Restore browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Regression Suite
        run: npx playwright test tests/regression --project=${{ matrix.browser }}
        env:
          VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.browser }}-report
          path: playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4: UI Tests — Cross-Browser Matrix
  # ──────────────────────────────────────────────────────────────────────────
  ui-tests:
    name: 🌐 UI Tests — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - browser: chromium
            display_name: Chrome
          - browser: firefox
            display_name: Firefox
          - browser: webkit
            display_name: Safari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Restore browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI Tests
        run: npx playwright test tests/ui --project=${{ matrix.browser }}
        env:
          VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.browser }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5: API Tests
  # ──────────────────────────────────────────────────────────────────────────
  api-tests:
    name: 🔌 API Tests
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run API Tests
        run: npx playwright test tests/api --project=api
        env:
          VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}

      - name: Upload API Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 6: Performance Tests
  # ──────────────────────────────────────────────────────────────────────────
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run Performance Tests
        run: npx playwright test tests/performance --project=performance

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: playwright-report/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 7: Mobile Tests
  # ──────────────────────────────────────────────────────────────────────────
  mobile-tests:
    name: 📱 Mobile Tests
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      - name: Run Mobile Tests
        run: |
          npx playwright test tests/ui --project="Mobile Chrome"
          npx playwright test tests/ui --project="Mobile Safari"
        env:
          VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}

      - name: Upload Mobile Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-report
          path: playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 8: Publish Allure Report to GitHub Pages
  # ──────────────────────────────────────────────────────────────────────────
  publish-report:
    name: 📊 Publish Report
    runs-on: ubuntu-latest
    needs: [ui-tests, api-tests, performance-tests]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Merge and publish HTML report
        run: |
          echo "Reports collected at all-reports/"
          ls all-reports/
